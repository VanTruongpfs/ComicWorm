# Copy to application-local.properties in the project root, then run:
# .\gradlew.bat bootRun --args='--spring.profiles.active=local'
# Complete configuration even when src/main/resources/application.properties is absent.
# Fill private values in the copied file or environment variables; the copy is gitignored.

# Application
spring.application.name=comicworm
server.port=${SERVER_PORT:8080}
app.base.url=${APP_BASE_URL:http://localhost:${server.port}}
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# MySQL: initialize database/schema.sql, then database/seed.sql on a new database.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookmooch_db_v3?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Authentication: replace this development placeholder with your own random secret.
app.jwt.secretkey=${JWT_SECRET_KEY:REPLACE_WITH_A_RANDOM_SECRET_OF_AT_LEAST_32_CHARACTERS}
app.jwt.expire.access.token=900000
app.jwt.expire.refresh.token=604800000

# Optional first administrator; both email and password must be supplied to create it.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=Local administrator

# SMTP: required when sending registration, verification and password-reset emails.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cloudinary: required to upload new product images.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=42MB

# Gemini chatbot: optional. Set CHAT_MODEL=google-genai and GEMINI_API_KEY to enable.
# Local CLIP image search does not use this API key.
spring.ai.model.chat=${CHAT_MODEL:none}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0.7

# Optional Google login; fill these properties or set matching environment variables.
GOOGLE_CLIENT_ID=
GOOGLE_CLIENT_SECRET=

# Optional VNPay sandbox integration; supply your merchant credentials to use it.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:${app.base.url}/api/checkout/vnpay-return}

# Local image search: web starts CLIP automatically after the one-time Python setup.
app.image-search.enabled=${APP_IMAGESEARCH_ENABLED:true}
app.image-search.auto-start=true
app.image-search.service-url=http://127.0.0.1:8091
app.image-search.model-name=clip-vit-b32-f41c383-rgb-v1
app.image-search.dimensions=512
app.image-search.allowed-image-hosts=res.cloudinary.com,picsum.photos,fastly.picsum.photos
