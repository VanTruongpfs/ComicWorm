# ===================================================================
# ComicWorm - File cấu hình mẫu cho môi trường Local
# Hướng dẫn: Copy file này thành "application-local.properties" 
# và điền các thông tin kết nối thực tế trên máy bạn.
# ===================================================================

# 1. Cơ sở dữ liệu MySQL Local
spring.datasource.url=jdbc:mysql://localhost:3306/bookmooch_db_v3?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=your_db_password

# 2. Gmail SMTP (Dùng App Password 16 ký tự của Google Account)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_gmail_app_password

# 3. Google Gemini AI API Key (Dùng cho Chatbot)
spring.ai.google.genai.api-key=your_gemini_api_key
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# 4. Cloudinary (Lưu trữ ảnh sản phẩm / avatar)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# 5. JWT Secret Key (Tối thiểu 32 ký tự)
app.jwt.secretkey=ComicWormSecretKeyForJwtAuthenticationMustBeAtLeast32BytesLong2026

# 6. Google OAuth2 Login (Lấy từ Google Cloud Console)
GOOGLE_CLIENT_ID=your_google_client_id.apps.googleusercontent.com
GOOGLE_CLIENT_SECRET=your_google_client_secret
