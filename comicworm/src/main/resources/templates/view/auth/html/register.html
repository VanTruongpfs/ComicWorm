<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | ComicWorm</title>
    <link rel="stylesheet" th:href="@{/auth/css/auth-shared.css}">
    <link rel="stylesheet" th:href="@{/auth/css/register.css}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card" aria-labelledby="register-title">
        <p class="auth-brand">
            <a th:href="@{/}" style="color:inherit; text-decoration:none;">&larr; ComicHub / ComicWorm</a>
        </p>
        <h1 class="auth-title" id="register-title">Tạo tài khoản mới</h1>
        <p class="auth-subtitle">Tham gia cộng đồng trao đổi sách và tìm cuốn sách tiếp theo của bạn.</p>

        <!-- Thông báo lỗi chung từ Server -->
        <div th:if="${errorMessage}" class="field-error" style="color: #dc3545; margin-bottom: 1rem; text-align: center; font-weight: bold;" th:text="${errorMessage}">
        </div>

        <form class="auth-form"
              id="register-form"
              th:action="@{/auth/register}"
              th:object="${registerDTO}"
              method="post"
              novalidate>

            <!-- Họ và tên -->
            <div class="field">
                <label for="full-name">Họ và tên</label>
                <input id="full-name"
                       type="text"
                       autocomplete="name"
                       th:field="*{fullName}"
                       required>
                <small class="field-error" data-error-for="fullName" style="color: #dc3545;">
                    <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                </small>
            </div>

            <!-- Email -->
            <div class="field">
                <label for="email">Email</label>
                <input id="email"
                       type="email"
                       autocomplete="email"
                       th:field="*{email}"
                       required>
                <small class="field-error" data-error-for="email" style="color: #dc3545;">
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </small>
            </div>

            <!-- Mật khẩu -->
            <div class="field">
                <label for="password">Mật khẩu</label>
                <div class="password-wrap">
                    <input id="password"
                           type="password"
                           autocomplete="new-password"
                           th:field="*{password}"
                           required>
                    <button class="password-toggle" type="button" data-toggle-password="password">Hiện</button>
                </div>
                <small class="field-error" data-error-for="password" style="color: #dc3545;">
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </small>
            </div>

            <!-- Nhập lại mật khẩu -->
            <div class="field">
                <label for="confirm-password">Nhập lại mật khẩu</label>
                <div class="password-wrap">
                    <input id="confirm-password"
                           type="password"
                           autocomplete="new-password"
                           th:field="*{confirmPassword}"
                           required>
                    <button class="password-toggle" type="button" data-toggle-password="confirmPassword">Hiện</button>
                </div>
                <small class="field-error" data-error-for="confirmPassword" style="color: #dc3545;">
                    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                </small>
            </div>

            <!-- Điều khoản dịch vụ -->
            <div class="field">
                <label class="check-label" for="terms">
                    <input id="terms" type="checkbox" th:field="*{terms}">
                    Tôi đồng ý với <a class="text-link" href="#terms">Điều khoản dịch vụ</a>
                </label>
                <small class="field-error" data-error-for="terms" style="color: #dc3545;">
                    <span th:if="${#fields.hasErrors('terms')}" th:errors="*{terms}"></span>
                </small>
            </div>

            <button class="auth-button" type="submit" data-submit>Đăng ký</button>
        </form>

        <p class="auth-switch">Đã có tài khoản?
            <a class="text-link" th:href="@{/auth/login}">Đăng nhập</a>
        </p>
    </section>
</main>

<div class="toast-region" data-toast-region aria-live="polite"></div>
<script type="module" th:src="@{/auth/js/register.js}"></script>
</body>
</html>
