<!DOCTYPE html>
<!-- Reset-password screen: accepts a token from the reset-link query string. -->
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu | ComicWorm</title>
    <link rel="stylesheet" href="../css/auth-shared.css">
    <link rel="stylesheet" href="../css/reset-password.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="reset-title">
            <p class="auth-brand">ComicWorm</p>
            <h1 class="auth-title" id="reset-title">Đặt mật khẩu mới</h1>
            <p class="auth-subtitle" data-reset-status>Chọn một mật khẩu mới cho tài khoản của bạn.</p>
            <form class="auth-form" id="reset-form" novalidate>
                <div class="field">
                    <label for="password">Mật khẩu mới</label>
                    <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="new-password" required><button class="password-toggle" type="button" data-toggle-password="password">Hiện</button></div>
                    <small class="field-error" data-error-for="password"></small>
                </div>
                <div class="field">
                    <label for="confirm-password">Nhập lại mật khẩu mới</label>
                    <div class="password-wrap"><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required><button class="password-toggle" type="button" data-toggle-password="confirmPassword">Hiện</button></div>
                    <small class="field-error" data-error-for="confirmPassword"></small>
                </div>
                <button class="auth-button" type="submit" data-submit>Đổi mật khẩu</button>
            </form>
            <p class="auth-switch"><a class="text-link" href="login.html">Quay lại đăng nhập</a></p>
        </section>
    </main>
    <div class="toast-region" data-toast-region aria-live="polite"></div>
    <script type="module" src="../js/reset-password.js"></script>
</body>
</html>
