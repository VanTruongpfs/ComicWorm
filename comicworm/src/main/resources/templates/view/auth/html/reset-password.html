<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | ComicWorm</title>
    <link rel="stylesheet" th:href="@{/auth/css/auth-shared.css}">
    <link rel="stylesheet" th:href="@{/auth/css/reset-password.css}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="reset-title">
            <p class="auth-brand">
                <a th:href="@{/}" style="color:inherit; text-decoration:none;">&larr; ComicHub / ComicWorm</a>
            </p>
            <h1 class="auth-title" id="reset-title">Đặt mật khẩu mới</h1>

            <!-- Trường hợp token không hợp lệ hoặc hết hạn -->
            <div th:unless="${validToken}" id="invalid-token-view" style="margin-top: 16px;">
                <div style="background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 16px; border-radius: 10px; margin-bottom: 20px; text-align: center;">
                    <div style="font-weight: 700; font-size: 1rem; margin-bottom: 6px;">Liên kết không khả dụng</div>
                    <div style="font-size: 0.9rem;" th:text="${errorMessage ?: 'Đường dẫn đổi mật khẩu không hợp lệ hoặc đã hết hạn.'}"></div>
                </div>
                <a class="auth-button" th:href="@{/auth/forgot-password}" style="display: block; text-align: center; line-height: 48px; text-decoration: none; margin-bottom: 12px;">
                    Gửi lại yêu cầu mới
                </a>
                <p class="auth-switch"><a class="text-link" th:href="@{/auth/login}">&larr; Quay lại đăng nhập</a></p>
            </div>

            <!-- Trường hợp token hợp lệ -->
            <div th:if="${validToken}" id="valid-token-view">
                <p class="auth-subtitle" data-reset-status>Chọn một mật khẩu mới cho tài khoản của bạn (tối thiểu 8 ký tự).</p>
                <form class="auth-form" id="reset-form" novalidate>
                    <input type="hidden" id="reset-token" th:value="${token}">

                    <div class="field">
                        <label for="password">Mật khẩu mới</label>
                        <div class="password-wrap">
                            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự" required>
                            <button class="password-toggle" type="button" data-toggle-password="password">Hiện</button>
                        </div>
                        <small class="field-error" data-error-for="password"></small>
                    </div>

                    <div class="field">
                        <label for="confirm-password">Nhập lại mật khẩu mới</label>
                        <div class="password-wrap">
                            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới" required>
                            <button class="password-toggle" type="button" data-toggle-password="confirmPassword">Hiện</button>
                        </div>
                        <small class="field-error" data-error-for="confirmPassword"></small>
                    </div>

                    <button class="auth-button" type="submit" data-submit>Đổi mật khẩu</button>
                </form>
                <p class="auth-switch"><a class="text-link" th:href="@{/auth/login}">&larr; Quay lại đăng nhập</a></p>
            </div>
        </section>
    </main>
    <div class="toast-region" data-toast-region aria-live="polite"></div>
    <script type="module" th:src="@{/auth/js/reset-password.js}"></script>
</body>
</html>
