<!DOCTYPE html>
<!-- Forgot-password screen: requests a reset link by email. -->
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | ComicWorm</title>
    <link rel="stylesheet" href="../css/auth-shared.css">
    <link rel="stylesheet" href="../css/forgot-password.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="forgot-title">
            <p class="auth-brand">ComicWorm</p>
            <h1 class="auth-title" id="forgot-title">Quên mật khẩu?</h1>
            <p class="auth-subtitle">Nhập email đã đăng ký để nhận hướng dẫn đổi mật khẩu.</p>
            <form class="auth-form" id="forgot-form" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                    <small class="field-error" data-error-for="email"></small>
                </div>
                <button class="auth-button" type="submit" data-submit>Gửi đường dẫn đổi mật khẩu</button>
            </form>
            <p class="auth-switch"><a class="text-link" href="login.html">Quay lại đăng nhập</a></p>
        </section>
    </main>
    <div class="toast-region" data-toast-region aria-live="polite"></div>
    <script type="module" src="../js/forgot-password.js"></script>
</body>
</html>
