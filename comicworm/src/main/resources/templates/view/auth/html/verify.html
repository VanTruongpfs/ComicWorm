<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác Thực Tài Khoản - ComicWorm</title>
    <link rel="stylesheet" th:href="@{/auth/css/style.css}">
    <style>
        .verify-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f6f9;
        }
        .verify-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 90%;
            text-align: center;
        }
        .status-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .btn-login {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 30px;
            background-color: #4A90E2;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-login:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>
<div class="verify-container">
    <div class="verify-card">
        <!-- Trường hợp THÀNH CÔNG -->
        <div th:if="${success}">
            <div class="status-icon">🎉</div>
            <h2 style="color: #2e7d32; margin-bottom: 12px;">Xác Thực Thành Công</h2>
            <p style="color: #555; line-height: 1.6;" th:text="${message}"></p>
            <a th:href="@{/auth/login}" class="btn-login">Đăng Nhập Ngay</a>
        </div>

        <!-- Trường hợp THẤT BẠI -->
        <div th:if="${!success}">
            <div class="status-icon">❌</div>
            <h2 style="color: #d32f2f; margin-bottom: 12px;">Xác Thực Thất Bại</h2>
            <p style="color: #555; line-height: 1.6;" th:text="${message}"></p>
            <a th:href="@{/auth/register}" class="btn-login" style="background-color: #757575;">Quay Lại Đăng Ký</a>
        </div>
    </div>
</div>
</body>
</html>
