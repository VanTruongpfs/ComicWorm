<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | ComicWorm</title>
    <link rel="stylesheet" th:href="@{/auth/css/auth-shared.css}">
    <link rel="stylesheet" th:href="@{/auth/css/login.css}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
        <p class="auth-brand">
            <a th:href="@{/}" style="color:inherit; text-decoration:none;">&larr; ComicHub / ComicWorm</a>
        </p>
        <h1 class="auth-title" id="login-title">Chào mừng trở lại</h1>
        <p class="auth-subtitle">Đăng nhập để tiếp tục trao đổi những cuốn sách bạn yêu thích.</p>

        <!-- Thông báo đăng xuất thành công -->
        <div th:if="${param.logout}" class="field-success" style="color: #15803d; background: #dcfce7; border: 1px solid #bbf7d0; padding: 10px 16px; border-radius: 8px; margin-bottom: 1.25rem; text-align: center; font-weight: 600; font-size: 0.9rem;">
            Bạn đã đăng xuất thành công khỏi hệ thống!
        </div>

        <!-- Thông báo đổi mật khẩu thành công -->
        <div th:if="${param.resetSuccess}" class="field-success" style="color: #15803d; background: #dcfce7; border: 1px solid #bbf7d0; padding: 10px 16px; border-radius: 8px; margin-bottom: 1.25rem; text-align: center; font-weight: 600; font-size: 0.9rem;">
            Đổi mật khẩu thành công! Vui lòng đăng nhập với mật khẩu mới.
        </div>

        <!-- Thông báo lỗi chung từ Controller -->
        <div th:if="${errorMessage}" class="field-error" style="color: #dc3545; margin-bottom: 1rem; text-align: center; font-weight: bold;" th:text="${errorMessage}">
        </div>

        <!-- Thông báo lỗi khi đăng nhập qua Google OAuth -->
        <div th:if="${param.oauthError}" class="field-error" style="color: #b91c1c; background: #fee2e2; border: 1px solid #fecaca; padding: 10px 16px; border-radius: 8px; margin-bottom: 1.25rem; text-align: center; font-weight: 600; font-size: 0.9rem;" th:text="${param.oauthError}">
        </div>

        <form class="auth-form"
              id="login-form"
              th:action="@{/auth/login}"
              th:object="${loginDTO}"
              method="post"
              novalidate>

            <div class="field">
                <label for="email">Email</label>
                <input id="email"
                       type="email"
                       autocomplete="username"
                       th:field="*{email}"
                       required>
                <small class="field-error" data-error-for="email" style="color: #dc3545;">
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </small>
            </div>

            <div class="field">
                <label for="password">Mật khẩu</label>
                <div class="password-wrap">
                    <input id="password"
                           type="password"
                           autocomplete="current-password"
                           th:field="*{password}"
                           required>
                    <button class="password-toggle" type="button" data-toggle-password="password">Hiện</button>
                </div>
                <small class="field-error" data-error-for="password" style="color: #dc3545;">
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </small>
            </div>

            <div class="form-row">
                <label class="check-label" for="remember">
                    <input id="remember" name="remember" type="checkbox"> Ghi nhớ đăng nhập
                </label>
                <a class="text-link" th:href="@{/auth/forgot-password}">Quên mật khẩu?</a>
            </div>

            <button class="auth-button" type="submit" data-submit>Đăng nhập</button>
        </form>

        <div class="auth-divider">
            <span>hoặc</span>
        </div>

        <a th:href="@{/oauth2/authorization/google}" class="google-login-btn" id="google-login-btn">
            <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            <span>Tiếp tục với Google</span>
        </a>

        <p class="auth-switch">Chưa có tài khoản?
            <a class="text-link" th:href="@{/auth/register}">Đăng ký ngay</a>
        </p>
    </section>
</main>

<div class="toast-region" data-toast-region aria-live="polite"></div>
<script type="module" th:src="@{/auth/js/login.js}"></script>
</body>
</html>
