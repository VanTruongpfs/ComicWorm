<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

    rel="stylesheet">

</head>

<body>

    <!-- Sidebar Navigation -->
    <nav class="sidebar">

              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
          </div>
          <h2 class="brand-name">ModDash</h2>
        </a>
      </div>

      <div class="nav-links">
        <a href="postModeration.html" class="nav-item nav-item-active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="16" y1="3" x2="21" y2="3" />
            <line x1="21" y1="3" x2="21" y2="8" />
            <line x1="4" y1="20" x2="21" y2="3" />
            <line x1="21" y1="16" x2="21" y2="21" />
            <line x1="16" y1="21" x2="21" y2="21" />
            <line x1="15" y1="15" x2="21" y2="21" />
            <line x1="4" y1="4" x2="9" y2="9" />
          </svg>
          <span>Duyệt bài</span>
          <span class="nav-badge" id="navPendingBadge">0</span>
        </a>
        <a href="report_resolution.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          </svg>
          <span>Xử lý báo cáo</span>
        </a>
        <a href="appeal-resolution.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3" />
          </svg>
          <span>TT Kháng nghị</span>
        </a>
        <a href="customer-support.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
            <line x1="8" y1="21" x2="16" y2="21" />
            <line x1="12" y1="17" x2="12" y2="21" />
          </svg>
          <span>CSKH Console</span>
        </a>

        <div
          style="margin-top:20px; padding-top:14px; border-top:1px solid rgba(0,0,0,0.08); display:flex; flex-direction:column; gap:6px;">
          <a href="dashboard.html" class="nav-item" style="color:#7c3aed;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
            </svg>
            <span>Admin Console</span>
          </a>
          <a href="../../buyer/html/home.html" class="nav-item" style="color:#2563eb;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            <span>Chợ ComicHub</span>
          </a>
          <a href="../../index.html" class="nav-item" style="color:#ea580c; font-weight:600;">

              <circle cx="12" cy="12" r="10" />

              <path d="M2 12h20" />
            </svg>
            <span>Master Portal</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- Main Workspace -->
    <div class="main-wrapper">

      <header class="top-bar">
        <div>
          <h1 class="page-title">Kiểm duyệt bài đăng</h1>
          <div class="status-indicator">
            <span class="status-dot"></span>
            <span id="headerStatus">Đang tải danh sách...</span>
          </div>
        </div>

        <div class="header-actions">
          <div class="search-input-wrap">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="searchInput" placeholder="Tìm theo tên truyện hoặc mã bài..." class="search-input"
              maxlength="255">
          </div>
          <div class="admin-user">
            <span class="admin-user-name" id="adminName">Quản trị viên</span>
            <a class="btn btn-outline admin-logout" href="/auth/logout">Đăng xuất</a>
          </div>
        </div>
      </header>

      <main class="main-content">
        <div class="mod-tabs" id="statusTabs" role="tablist">
          <button type="button" class="mod-tab active" data-status="PENDING">Chờ duyệt <span class="mod-tab-count" id="countPENDING">0</span></button>
          <button type="button" class="mod-tab" data-status="APPROVED">Đã duyệt <span class="mod-tab-count" id="countAPPROVED">0</span></button>
          <button type="button" class="mod-tab" data-status="REJECTED">Đã từ chối <span class="mod-tab-count" id="countREJECTED">0</span></button>
        </div>

        <div class="mod-layout">
          <!-- Danh sách bài -->
          <section class="mod-list-col">
            <div class="section-header">
              <h2 class="section-title" id="listTitle">Bài chờ duyệt</h2>
              <span class="queue-count" id="listCount">0 bài</span>
            </div>
            <div class="queue-list" id="postList"></div>
            <div class="mod-pager" id="pager"></div>
          </section>

          <!-- Chi tiết bài -->
          <section class="mod-detail-col">
            <div class="mod-detail" id="detailPanel">
              <div class="mod-empty">Chọn một bài ở danh sách bên trái để xem chi tiết.</div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <!-- Hộp thoại từ chối -->
  <div class="mod-modal" id="rejectModal" hidden>
    <div class="mod-modal-backdrop" data-close></div>
    <div class="mod-modal-card" role="dialog" aria-modal="true" aria-labelledby="rejectTitle">
      <h3 id="rejectTitle">Từ chối bài đăng</h3>
      <p class="mod-modal-sub" id="rejectPostName"></p>

      <label class="mod-label" for="rejectPreset">Lý do thường gặp</label>
      <select id="rejectPreset" class="mod-input">
        <option value="">-- Chọn nhanh lý do --</option>
        <option>Nghi ngờ truyện in lậu / sách scan không bản quyền</option>
        <option>Mô tả hoặc độ mới không đúng thực tế</option>
        <option>Hình ảnh không rõ ràng hoặc không đúng sản phẩm</option>
        <option>Giá bán bất thường hoặc nghi ngờ spam</option>
        <option>Nội dung không phù hợp / vi phạm quy định</option>
      </select>

      <label class="mod-label" for="rejectReason">Lý do gửi cho người bán <span class="mod-required">*</span></label>
      <textarea id="rejectReason" class="mod-input" rows="4" maxlength="1000"
        placeholder="Nhập lý do cụ thể để người bán biết cần chỉnh sửa gì (tối thiểu 5 ký tự)..."></textarea>
      <div class="mod-field-error" id="rejectError" hidden></div>

      <div class="mod-modal-actions">
        <button type="button" class="btn btn-outline" data-close>Hủy</button>
        <button type="button" class="btn btn-danger" id="rejectConfirm">Xác nhận từ chối</button>
      </div>
    </div>
  </div>

  <div class="mod-toast" id="toast" hidden></div>
  <script src="../js/postModeration.js"></script>
</body>

</html>
