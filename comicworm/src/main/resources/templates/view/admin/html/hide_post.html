<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ẩn Bài Đăng Vi Phạm - Kiểm Duyệt BookMooch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin-common.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/postModeration.css">
  <style>
    .hide-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      max-width: 680px;
      margin: 40px auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .badge-ban { background: #fee2e2; color: #dc2626; }
    .badge-warn { background: #fef3c7; color: #d97706; }
    .reason-select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .notes-area {
      width: 100%;
      height: 120px;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
    }
    .action-group {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="app-container app-layout">
    <!-- Dynamic Sidebar Component Container -->
    <div id="sidebarContainer" data-active="postModeration"></div>

    <!-- Sidebar Navigation -->
    

    <!-- Main Content -->
    <main class="main-content">
      <div class="hide-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
          <h2 style="font-size:1.4rem; font-weight:700;">Xử lý bài đăng vi phạm</h2>
          <span id="actionBadge" class="badge-status badge-ban">Cấm vĩnh viễn (Ban)</span>
        </div>

        <p style="color:#64748b; font-size:0.95rem; margin-bottom:20px;">
          Bài đăng sẽ bị gỡ khỏi sàn giao dịch và người bán sẽ nhận được thông báo giải trình kèm biên bản xử phạt.
        </p>

        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:16px; margin-bottom:24px;">
          <div style="font-weight:700; color:#1e293b;" id="postTitle">Bài đăng: Bộ truyện tranh Slam Dunk Deluxe 1-24</div>
          <div style="font-size:0.85rem; color:#64748b; margin-top:4px;">Người bán: <strong>otakushop_vn</strong> • Mã bài: #POST-8821</div>
        </div>

        <label style="font-weight:600; font-size:0.9rem; color:#334155;">Lý do áp dụng hình phạt *</label>
        <select class="reason-select" id="reasonSelect">
          <option value="fake_print">Nghi ngờ truyện in lậu / sách scan không bản quyền</option>
          <option value="misleading">Sai lệch tình trạng thực tế (mô tả Like New nhưng rách bìa/mất trang)</option>
          <option value="prohibited">Nội dung không phù hợp hoặc ngôn từ bạo lực cấm</option>
          <option value="spam">Spam bài đăng trùng lặp hoặc giá khống bất thường</option>
          <option value="other">Lý do khác</option>
        </select>

        <label style="font-weight:600; font-size:0.9rem; color:#334155; display:block; margin-top:16px;">Ghi chú chi tiết cho Người bán & CSKH</label>
        <textarea class="notes-area" id="notesInput" placeholder="Nhập căn cứ thẩm định hình ảnh hoặc trích dẫn quy định vi phạm..."></textarea>

        <div class="action-group">
          <button class="btn btn-outline" onclick="window.history.back()">Hủy bỏ</button>
          <button class="btn btn-danger" id="submitActionBtn" onclick="confirmAction()">Xác nhận gỡ bài</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get('action') || 'ban';
    const badge = document.getElementById('actionBadge');
    const submitBtn = document.getElementById('submitActionBtn');

    if (action === 'warn') {
      badge.textContent = 'Cảnh cáo & Tạm ẩn';
      badge.className = 'badge-status badge-warn';
      submitBtn.textContent = 'Gửi cảnh cáo & Tạm ẩn';
      submitBtn.className = 'btn btn-warning';
    }

    function confirmAction() {
      const reason = document.getElementById('reasonSelect').value;
      alert(`Đã thực hiện thao tác ${action === 'warn' ? 'Cảnh cáo' : 'Cấm/Gỡ bài'} thành công! Mã lý do: ${reason}`);
      window.location.href = 'postModeration.html';
    }
  </script>
  <script src="../js/common.js"></script>
</body>
</html>
