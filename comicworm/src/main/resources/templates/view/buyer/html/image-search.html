<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm truyện bằng hình ảnh — ComicWorm</title>
    <link rel="stylesheet" th:href="@{/buyer/css/image-search.css}">
</head>
<body>
<header class="image-search-header">
    <a th:href="@{/buyer/html/home.html}" class="image-search-brand">COMIC<span>WORM</span></a>
    <a th:href="@{/buyer/html/category.html}">Khám phá truyện →</a>
</header>
<main>
    <div class="image-search-heading">
        <span class="image-search-eyebrow">TÌM BẰNG HÌNH ẢNH</span>
        <h1>Có ảnh bìa, tìm ngay truyện.</h1>
        <p>Tải lên ảnh bìa hoặc ảnh truyện bạn đang tìm. Khám phá những sản phẩm có hình ảnh tương tự.</p>
    </div>
    <form id="image-search-form">
        <div class="image-search-upload">
            <label for="query-image">Chọn ảnh truyện</label>
            <input id="query-image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required aria-describedby="image-file-hint">
            <p id="image-file-hint">JPG, PNG, WebP hoặc GIF · Tối đa 5 MB. Ảnh bìa rõ, chụp thẳng sẽ dễ tìm hơn.</p>
        </div>
        <img id="query-preview" alt="Ảnh truyện bạn đã chọn" hidden>
        <button type="submit">Tìm truyện tương tự</button>
    </form>
    <p id="image-search-status" role="status" aria-live="polite"></p>
    <div id="image-search-results" aria-label="Sản phẩm tương tự"></div>
</main>
<script th:src="@{/buyer/js/image-search.js}"></script>
</body>
</html>
