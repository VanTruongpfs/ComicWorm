<!DOCTYPE html>
<!-- Support workspace: submit a ticket and track recent customer-service responses. -->
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Yêu cầu hỗ trợ | BookMooch</title><link rel="stylesheet" href="../../shared/styles/global-design-tokens.css"><link rel="stylesheet" href="../../shared/sidebar/sidebar.css"><link rel="stylesheet" href="../css/request_support.css"></head>
<body><div class="app-shell"><div data-sidebar-mount></div><main class="app-main"><header class="page-header"><div><p class="eyebrow">Hỗ trợ & Chăm sóc</p><h1 class="page-title">Gửi yêu cầu hỗ trợ</h1><p class="page-subtitle">Tạo ticket và theo dõi phản hồi mới nhất từ đội ngũ chăm sóc khách hàng.</p></div></header><div class="content-grid two-columns"><section class="surface-card"><h2>Tạo ticket hỗ trợ</h2><form id="support-form" class="form-grid"><div class="form-grid two-columns"><div class="field"><label for="subject">Chủ đề</label><select id="subject" name="subject" required><option value="">Chọn chủ đề</option><option>Tài khoản</option><option>Thanh toán</option><option>Lỗi kỹ thuật</option><option>Khác</option></select></div><div class="field"><label for="priority">Mức độ ưu tiên</label><select id="priority" name="priority"><option>Bình thường</option><option>Gấp</option></select></div></div><div class="field"><label for="content">Nội dung yêu cầu</label><textarea id="content" name="content" placeholder="Bạn cần BookMooch hỗ trợ điều gì?" required></textarea><small class="field-error" data-error-for="content"></small></div><div class="form-actions"><button class="button" type="submit">Gửi yêu cầu</button></div></form></section><section class="surface-card"><h2>Yêu cầu gần đây</h2><div class="ticket-list" data-ticket-list></div></section></div></main></div><div class="toast-region" data-toast-region aria-live="polite"></div><script src="../../shared/js/account-api.js"></script>
    <script src="../../shared/sidebar/sidebar.js"></script><script src="../js/request_support.js"></script></body></html>
