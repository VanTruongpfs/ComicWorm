spring.application.name=comicworm
server.port=8080
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# Database kết nối bookmooch_db_v3 (Mật khẩu để trống)
spring.datasource.url=jdbc:mysql://localhost:3306/bookmooch_db_v3?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Khóa JWT (256-bit)
app.jwt.secretkey=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expire.access.token=86400000
app.jwt.expire.refresh.token=604800000

app.base.url=http://localhost:8080

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true